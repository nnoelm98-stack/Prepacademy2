<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrepAcademy — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F9FA;--white:#FFFFFF;--border:#EAECF0;--border2:#F2F4F7;
  --navy:#0F1729;--navy2:#1A2540;--blue:#2563EB;--blue-light:#EFF6FF;--blue-mid:#BFDBFE;
  --text:#0F1729;--text2:#4B5563;--text3:#9CA3AF;
  --green:#15803D;--green-bg:#F0FDF4;--amber:#B45309;--amber-bg:#FFFBEB;--red:#B91C1C;--red-bg:#FEF2F2;
  --r:10px;--rs:7px;--sh:0 1px 2px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.04)
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
/* SIDEBAR */
.sidebar{width:232px;flex-shrink:0;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1.25rem 1rem;position:sticky;top:0;height:100vh}
.s-logo{display:flex;align-items:center;gap:8px;padding:0 .5rem;margin-bottom:1.75rem}
.s-logo-mark{width:26px;height:26px;background:var(--navy);border-radius:6px;display:flex;align-items:center;justify-content:center}
.s-logo-mark svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.s-logo-text{font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--navy)}
.nav-section{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:0 .625rem;margin:.875rem 0 .25rem}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--rs);font-size:13.5px;font-weight:400;color:var(--text2);cursor:pointer;margin-bottom:1px;transition:all .1s;text-decoration:none}
.nav-item:hover{background:#F3F4F6;color:var(--text)}
.nav-item.active{background:var(--blue-light);color:var(--blue);font-weight:500}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item.active .nav-icon{opacity:1}
.sb-bottom{margin-top:auto;padding-top:1rem;border-top:1px solid var(--border)}
.user-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rs)}
.u-av{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;letter-spacing:.02em}
/* MAIN */
.main{flex:1;padding:2rem 2.5rem;overflow-y:auto}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2rem}
.page-date{font-size:12px;color:var(--text3);margin-bottom:3px;font-weight:400}
.page-title{font-size:22px;font-weight:600;letter-spacing:-.03em;color:var(--navy)}
.streak-pill{display:inline-flex;align-items:center;gap:5px;background:var(--amber-bg);color:var(--amber);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid #FDE68A}
/* STAT CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1.125rem 1.25rem;box-shadow:var(--sh)}
.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.625rem}
.stat-label{font-size:12px;font-weight:500;color:var(--text3);letter-spacing:.01em}
.stat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.stat-num{font-size:28px;font-weight:300;letter-spacing:-.04em;color:var(--navy);line-height:1}
.stat-num b{font-weight:600}
.stat-sub{font-size:12px;color:var(--text3);margin-top:3px}
/* WEEK */
.week-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1.125rem 1.25rem;margin-bottom:1.5rem;box-shadow:var(--sh)}
.week-title{font-size:12px;font-weight:500;color:var(--text3);margin-bottom:.875rem;letter-spacing:.01em}
.days-row{display:flex;gap:6px}
.day{flex:1;text-align:center}
.day-name{font-size:10px;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.day-dot{width:32px;height:32px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text3);background:#F9FAFB;font-weight:400}
.day-dot.done{background:var(--blue);color:#fff;font-size:13px}
.day-dot.today{background:var(--blue-light);color:var(--blue);border:1.5px solid var(--blue-mid);font-weight:600}
/* MODULE CARDS */
.modules-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:1.5rem}
.mod-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1.125rem 1.25rem;cursor:pointer;transition:border-color .1s,box-shadow .1s;box-shadow:var(--sh)}
.mod-card:hover{border-color:var(--blue-mid);box-shadow:0 4px 12px rgba(37,99,235,.08)}
.mod-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.625rem}
.mod-name{font-size:13px;font-weight:500;letter-spacing:-.01em}
.mod-pct-label{font-size:12px;color:var(--text3)}
.mod-bar{height:4px;background:#F3F4F6;border-radius:99px;overflow:hidden;margin-bottom:.5rem}
.mod-bar-fill{height:4px;border-radius:99px;transition:width .4s}
.mod-next{font-size:12px;color:var(--text3)}
.mod-next a{color:var(--blue);text-decoration:none;font-weight:500}
.mod-next a:hover{text-decoration:underline}
/* BOTTOM */
.bottom-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1.125rem 1.25rem;box-shadow:var(--sh)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.875rem}
.card-title{font-size:13px;font-weight:500;color:var(--text)}
.card-link{font-size:12px;color:var(--blue);text-decoration:none;font-weight:500}
.lesson-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border2)}
.lesson-row:last-child{border-bottom:none}
.l-badge{width:32px;height:32px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;letter-spacing:.02em}
.l-info{flex:1;min-width:0}
.l-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.l-meta{font-size:11px;color:var(--text3);margin-top:1px}
.l-btn{font-size:11px;padding:4px 11px;border-radius:999px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;border:none;font-family:inherit;transition:all .1s}
.l-btn.start{background:var(--blue);color:#fff}
.l-btn.start:hover{background:#1D4ED8}
.l-btn.next{background:var(--blue-light);color:var(--blue)}
.recent-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border2)}
.recent-row:last-child{border-bottom:none}
.r-pill{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500;flex-shrink:0}
.empty{font-size:13px;color:var(--text3);padding:1.25rem 0;text-align:center;line-height:1.7}
</style>
</head>

  <div class="bottom-grid">
    <div class="card">

function getP(){return JSON.parse(localStorage.getItem('pa_progress')||'{}')}
function getName(){return localStorage.getItem('pa_name')||'Student'}
function getStreak(){
  const p=getP(),dates=[...new Set(Object.values(p).map(v=>v.date).filter(Boolean).map(d=>d.split('T')[0]))].sort();
  if(!dates.length)return 0;
  const today=new Date().toISOString().split('T')[0];
  if(dates[dates.length-1]!==today)return 0;
  let s=1;for(let i=dates.length-2;i>=0;i--){if((new Date(dates[i+1])-new Date(dates[i]))/86400000===1)s++;else break;}
  return s;
}

function render(){
  const p=getP(),name=getName(),all=CUR.flatMap(m=>m.lessons),doneIds=Object.keys(p);
  document.getElementById('sidebarName').textContent=name;
  document.getElementById('avatarInitial').textContent=name[0].toUpperCase();
  const h=new Date().getHours();
  document.getElementById('greetingText').textContent=(h<12?'Good morning, ':h<17?'Good afternoon, ':'Good evening, ')+name;
  document.getElementById('dateLabel').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const streak=getStreak();
  document.getElementById('streakPill').textContent=(streak>0?'🔥 ':'')+streak+'-day streak';
  document.getElementById('statDone').textContent=doneIds.length;
  document.getElementById('statTotal').textContent='of '+all.length+' total';
  const scores=Object.values(p).map(v=>v.score).filter(s=>s!=null);
  document.getElementById('statScore').textContent=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*100/3)+'%':'—';
  let am=null;for(const m of CUR){if(m.lessons.some(l=>!doneIds.includes(l.id))){am=m;break;}}
  if(am){document.getElementById('statModule').textContent='Module '+am.mod;const nx=am.lessons.find(l=>!doneIds.includes(l.id));document.getElementById('statModuleSub').textContent=nx?nx.title.slice(0,30)+'...':'Almost done!';}

  // Week strip
  const we=document.getElementById('weekStrip');we.innerHTML='';
  const ad=[...new Set(Object.values(p).map(v=>v.date).filter(Boolean).map(d=>d.split('T')[0]))];
  const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=d.toISOString().split('T')[0],it=i===0,id=ad.includes(ds);const div=document.createElement('div');div.className='day';div.innerHTML=`<div class="day-name">${dn[d.getDay()]}</div><div class="day-dot ${it?'today':id?'done':''}">${id&&!it?'✓':d.getDate()}</div>`;we.appendChild(div);}

  // Module cards
  const mg=document.getElementById('modulesGrid');mg.innerHTML='';
  CUR.forEach(m=>{const c=MC[m.mod],md=m.lessons.filter(l=>doneIds.includes(l.id)).length,pct=Math.round(md/m.lessons.length*100),nx=m.lessons.find(l=>!doneIds.includes(l.id)),card=document.createElement('div');card.className='mod-card';card.onclick=()=>location.href='lessons.html?mod='+m.mod;card.innerHTML=`<div class="mod-top"><div class="mod-name" style="color:${c.color}">${m.label}</div><div class="mod-pct-label">${md}/${m.lessons.length}</div></div><div class="mod-bar"><div class="mod-bar-fill" style="width:${pct}%;background:${c.color}"></div></div><div class="mod-next">${nx?`Next: <a href="${nx.url}" onclick="event.stopPropagation()">${nx.title}</a>`:'<span style="color:var(--green);font-weight:500">✓ Complete</span>'}</div>`;mg.appendChild(card);});

  // Continue
  const ce=document.getElementById('continueLessons');ce.innerHTML='';
  const up=[];for(const m of CUR){for(const l of m.lessons){if(!doneIds.includes(l.id)){up.push({...l,mod:m.mod,c:MC[m.mod]});if(up.length>=4)break;}}if(up.length>=4)break;}
  if(!up.length){ce.innerHTML='<div class="empty">🎉 All 74 lessons complete!</div>';}
  else up.forEach((l,i)=>{const r=document.createElement('div');r.className='lesson-row';r.innerHTML=`<div class="l-badge" style="background:${l.c.bg};color:${l.c.color}">${l.c.label}</div><div class="l-info"><div class="l-title">${l.title}</div><div class="l-meta">Module ${l.mod} · ${l.min} min</div></div><a href="${l.url}" class="l-btn ${i===0?'start':'next'}">${i===0?'Start →':'Next'}</a>`;ce.appendChild(r);});

  // Recent
  const re=document.getElementById('recentActivity'),rc=Object.entries(p).sort((a,b)=>new Date(b[1].date)-new Date(a[1].date)).slice(0,6);
  if(!rc.length){re.innerHTML='<div class="empty">No activity yet.<br>Start your first lesson!</div>';}
  else{re.innerHTML='';rc.forEach(([id,data])=>{const l=all.find(x=>x.id===id);if(!l)return;const pct=data.score!=null?Math.round(data.score*100/3):null;const r=document.createElement('div');r.className='recent-row';r.innerHTML=`<div style="min-width:0;flex:1"><div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.title}</div><div style="font-size:11px;color:var(--text3)">${new Date(data.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div></div>${pct!=null?`<span class="r-pill" style="background:${pct>=67?'var(--green-bg)':pct>=33?'var(--amber-bg)':'var(--red-bg)'};color:${pct>=67?'var(--green)':pct>=33?'var(--amber)':'var(--red)'}">${pct}%</span>`:''}`; re.appendChild(r);});}
}
render();
</script>
</body>
</html>
