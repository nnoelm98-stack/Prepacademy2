<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrepAcademy — Lessons</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F9FA;--white:#FFFFFF;--border:#EAECF0;--border2:#F2F4F7;--navy:#0F1729;--blue:#2563EB;--blue-light:#EFF6FF;--blue-mid:#BFDBFE;--text:#0F1729;--text2:#4B5563;--text3:#9CA3AF;--green:#15803D;--green-bg:#F0FDF4;--amber:#B45309;--amber-bg:#FFFBEB;--red:#B91C1C;--red-bg:#FEF2F2;--r:10px;--rs:7px;--sh:0 1px 2px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
.sidebar{width:232px;flex-shrink:0;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1.25rem 1rem;position:sticky;top:0;height:100vh}
.s-logo{display:flex;align-items:center;gap:8px;padding:0 .5rem;margin-bottom:1.75rem}
.s-logo-mark{width:26px;height:26px;background:var(--navy);border-radius:6px;display:flex;align-items:center;justify-content:center}
.s-logo-mark svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.s-logo-text{font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--navy)}
.nav-section{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:0 .625rem;margin:.875rem 0 .25rem}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--rs);font-size:13.5px;color:var(--text2);cursor:pointer;margin-bottom:1px;transition:all .1s;text-decoration:none}
.nav-item:hover{background:#F3F4F6;color:var(--text)}
.nav-item.active{background:var(--blue-light);color:var(--blue);font-weight:500}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item.active .nav-icon{opacity:1}
.sb-bottom{margin-top:auto;padding-top:1rem;border-top:1px solid var(--border)}
.user-row{display:flex;align-items:center;gap:9px;padding:8px 10px}
.u-av{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.main{flex:1;padding:2rem 2.5rem;overflow-y:auto}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.page-title{font-size:20px;font-weight:600;letter-spacing:-.03em;color:var(--navy)}
.page-sub{font-size:13px;color:var(--text3)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:400;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:var(--white);transition:all .1s}
.tab:hover{border-color:var(--blue-mid);color:var(--text)}
.tab.active{font-weight:500;border-color:transparent;color:#fff}
.mod-block{margin-bottom:2rem}
.mod-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.625rem}
.mod-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.mod-meta{font-size:12px;color:var(--text3)}
.mod-pbar{height:4px;background:var(--border2);border-radius:99px;overflow:hidden;margin-bottom:1rem}
.mod-pfill{height:4px;border-radius:99px}
.lessons-list{display:flex;flex-direction:column;gap:2px}
.lesson-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--rs);background:var(--white);border:1px solid var(--border);text-decoration:none;color:var(--text);transition:all .1s;box-shadow:var(--sh)}
.lesson-row:hover{border-color:var(--blue-mid)}
.lesson-row.done{border-color:#D1FAE5}
.l-num{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.l-body{flex:1;min-width:0}
.l-name{font-size:13px;font-weight:500}
.l-sub{font-size:11px;color:var(--text3);margin-top:1px}
.l-right{display:flex;align-items:center;gap:8px}
.l-score{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500}
.l-btn{font-size:11px;padding:4px 11px;border-radius:999px;font-weight:500;border:none;cursor:pointer;font-family:inherit;text-decoration:none;transition:all .1s}
.l-btn.done{background:var(--green-bg);color:var(--green)}
.l-btn.start{background:var(--blue);color:#fff}
.l-btn.start:hover{background:#1D4ED8}
</style>
</head>
<body>
<nav class="sidebar">
  <div class="s-logo"><div class="s-logo-mark"><svg viewBox="0 0 14 14"><path d="M2 7h10M7 2l5 5-5 5"/></svg></div><span class="s-logo-text">PrepAcademy</span></div>
  <div class="nav-section">Learn</div>
  <a class="nav-item" href="dashboard.html"><svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg>Dashboard</a>
  <a class="nav-item active" href="lessons.html"><svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h8"/></svg>Lessons</a>
  <div class="nav-section">Track</div>
  <a class="nav-item" href="progress.html"><svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12l3-4 3 2 3-5 3 3"/></svg>Progress</a>
  <a class="nav-item" href="profile.html"><svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>Profile</a>
  <div class="sb-bottom"><div class="user-row"><div class="u-av" id="avatarInitial">S</div><div><div style="font-size:13px;font-weight:500;color:var(--navy)" id="sidebarName">Student</div><div style="font-size:11px;color:var(--text3)">PrepAcademy</div></div></div></div>
</nav>
<main class="main">
  <div class="top-bar">
    <div><div class="page-title">Lessons</div><div class="page-sub">74 lessons across 4 modules</div></div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div id="content"></div>
</main>
<script>
const MC={1:{color:'#1D4ED8',bg:'#EFF6FF'},2:{color:'#047857',bg:'#ECFDF5'},3:{color:'#6D28D9',bg:'#F5F3FF'},4:{color:'#B45309',bg:'#FFFBEB'}};
const CUR=[
  {mod:1,label:'Module 1',full:'Information & Ideas',lessons:[{id:'1-1',title:'1.1 Central Ideas & Details',url:'/module1/lesson-1-1.html',min:13},{id:'1-2',title:'1.2 Command of Evidence',url:'/module1/lesson-1-2.html',min:13},{id:'1-3',title:'1.3 Inferences',url:'/module1/lesson-1-3.html',min:12},{id:'1-4',title:'1.4 Purpose & Function',url:'/module1/lesson-1-4.html',min:12},{id:'1-5',title:'1.5 Text Structure',url:'/module1/lesson-1-5.html',min:12},{id:'1-6',title:'1.6 Cross-Text Connections',url:'/module1/lesson-1-6.html',min:13},{id:'1-7',title:'1.7 Quantitative Evidence',url:'/module1/lesson-1-7.html',min:12},{id:'1-8',title:'1.8 Rhetorical Synthesis',url:'/module1/lesson-1-8.html',min:13},{id:'1-9',title:"1.9 Author's Purpose",url:'/module1/lesson-1-9.html',min:12},{id:'1-10',title:'1.10 Paired Passages',url:'/module1/lesson-1-10.html',min:14}]},
  {mod:2,label:'Module 2',full:'Expression & Conventions',lessons:[{id:'2-1',title:'2.1 Transition Words',url:'/module2/lesson-2-1.html',min:12},{id:'2-2',title:'2.2 Sentence Boundaries',url:'/module2/lesson-2-2.html',min:12},{id:'2-3',title:'2.3 Subject-Verb Agreement',url:'/module2/lesson-2-3.html',min:12},{id:'2-4',title:'2.4 Pronoun Agreement',url:'/module2/lesson-2-4.html',min:12},{id:'2-5',title:'2.5 Punctuation: Commas',url:'/module2/lesson-2-5.html',min:12},{id:'2-6',title:'2.6 Semicolons & Colons',url:'/module2/lesson-2-6.html',min:12},{id:'2-7',title:'2.7 Dashes & Parentheses',url:'/module2/lesson-2-7.html',min:12},{id:'2-8',title:'2.8 Rhetorical Goal',url:'/module2/lesson-2-8.html',min:12},{id:'2-9',title:'2.9 Supporting Detail',url:'/module2/lesson-2-9.html',min:12},{id:'2-10',title:'2.10 Concision',url:'/module2/lesson-2-10.html',min:12},{id:'2-11',title:'2.11 Logical Sequence',url:'/module2/lesson-2-11.html',min:12},{id:'2-12',title:'2.12 Word Choice',url:'/module2/lesson-2-12.html',min:12},{id:'2-13',title:'2.13 Formal vs. Informal',url:'/module2/lesson-2-13.html',min:12},{id:'2-14',title:'2.14 Verb Tense, Mood & Voice',url:'/module2/lesson-2-14.html',min:13},{id:'2-15',title:'2.15 Parallel Structure',url:'/module2/lesson-2-15.html',min:13},{id:'2-16',title:'2.16 Modifiers',url:'/module2/lesson-2-16.html',min:13},{id:'2-17',title:'2.17 Possessives & Apostrophes',url:'/module2/lesson-2-17.html',min:12},{id:'2-18',title:'2.18 Commonly Confused Words',url:'/module2/lesson-2-18.html',min:12}]},
  {mod:3,label:'Module 3',full:'Math: No Calculator',lessons:[{id:'3-1',title:'3.1 Linear Equations: One Variable',url:'/module3/lesson-3-1.html',min:13},{id:'3-2',title:'3.2 Linear Equations: Two Variables',url:'/module3/lesson-3-2.html',min:13},{id:'3-3',title:'3.3 Systems of Linear Equations',url:'/module3/lesson-3-3.html',min:13},{id:'3-4',title:'3.4 Inequalities',url:'/module3/lesson-3-4.html',min:12},{id:'3-5',title:'3.5 Linear Inequalities & Systems',url:'/module3/lesson-3-5.html',min:13},{id:'3-6',title:'3.6 Absolute Value Inequalities',url:'/module3/lesson-3-6.html',min:12},{id:'3-7',title:'3.7 Absolute Value',url:'/module3/lesson-3-7.html',min:12},{id:'3-8',title:'3.8 Linear Functions & Slope',url:'/module3/lesson-3-8.html',min:13},{id:'3-9',title:'3.9 Introduction to Quadratics',url:'/module3/lesson-3-9.html',min:13},{id:'3-10',title:'3.10 Solving Quadratic Equations',url:'/module3/lesson-3-10.html',min:13},{id:'3-11',title:'3.11 Parabolas & Vertex Form',url:'/module3/lesson-3-11.html',min:13},{id:'3-12',title:'3.12 Polynomials',url:'/module3/lesson-3-12.html',min:13},{id:'3-13',title:'3.13 Rational Expressions',url:'/module3/lesson-3-13.html',min:13},{id:'3-14',title:'3.14 Radicals & Rational Exponents',url:'/module3/lesson-3-14.html',min:12},{id:'3-15',title:'3.15 Exponential Functions',url:'/module3/lesson-3-15.html',min:13},{id:'3-16',title:'3.16 Function Notation & Operations',url:'/module3/lesson-3-16.html',min:13},{id:'3-17',title:'3.17 Ratios & Proportions',url:'/module3/lesson-3-17.html',min:12},{id:'3-18',title:'3.18 Percentages',url:'/module3/lesson-3-18.html',min:12},{id:'3-19',title:'3.19 Unit Analysis & Conversions',url:'/module3/lesson-3-19.html',min:11},{id:'3-20',title:'3.20 Statistics & Data Interpretation',url:'/module3/lesson-3-20.html',min:13},{id:'3-21',title:'3.21 Scatterplots & Data Analysis',url:'/module3/lesson-3-21.html',min:12},{id:'3-22',title:'3.22 Probability',url:'/module3/lesson-3-22.html',min:12}]},
  {mod:4,label:'Module 4',full:'Math: Calculator',lessons:[{id:'4-1',title:'4.1 Linear Equations & Graphs',url:'/module4/lesson-4-1.html',min:12},{id:'4-2',title:'4.2 Systems of Equations',url:'/module4/lesson-4-2.html',min:13},{id:'4-3',title:'4.3 Quadratic Functions',url:'/module4/lesson-4-3.html',min:13},{id:'4-4',title:'4.4 Exponential Growth & Decay',url:'/module4/lesson-4-4.html',min:13},{id:'4-5',title:'4.5 Geometry Fundamentals',url:'/module4/lesson-4-5.html',min:13},{id:'4-6',title:'4.6 Triangles & Pythagorean Theorem',url:'/module4/lesson-4-6.html',min:13},{id:'4-7',title:'4.7 Trigonometry',url:'/module4/lesson-4-7.html',min:13},{id:'4-8',title:'4.8 Circles',url:'/module4/lesson-4-8.html',min:13},{id:'4-9',title:'4.9 Volume & 3D Geometry',url:'/module4/lesson-4-9.html',min:12},{id:'4-10',title:'4.10 Coordinate Geometry',url:'/module4/lesson-4-10.html',min:12},{id:'4-11',title:'4.11 Statistics & Data Analysis',url:'/module4/lesson-4-11.html',min:13},{id:'4-12',title:'4.12 Probability & Expected Value',url:'/module4/lesson-4-12.html',min:13},{id:'4-13',title:'4.13 Complex Numbers',url:'/module4/lesson-4-13.html',min:11},{id:'4-14',title:'4.14 Polynomial & Rational Functions',url:'/module4/lesson-4-14.html',min:13},{id:'4-15',title:'4.15 Linear & Exponential Models',url:'/module4/lesson-4-15.html',min:13},{id:'4-16',title:'4.16 Two-Variable Data',url:'/module4/lesson-4-16.html',min:13},{id:'4-17',title:'4.17 Inference & Sampling',url:'/module4/lesson-4-17.html',min:12},{id:'4-18',title:'4.18 Ratios, Rates & Proportions',url:'/module4/lesson-4-18.html',min:13},{id:'4-19',title:'4.19 Percentages & Interest',url:'/module4/lesson-4-19.html',min:12},{id:'4-20',title:'4.20 Functions & Transformations',url:'/module4/lesson-4-20.html',min:13},{id:'4-21',title:'4.21 Systems of Inequalities',url:'/module4/lesson-4-21.html',min:12},{id:'4-22',title:'4.22 Quadratic & Polynomial Applications',url:'/module4/lesson-4-22.html',min:13},{id:'4-23',title:'4.23 Geometry Applications',url:'/module4/lesson-4-23.html',min:13},{id:'4-24',title:'4.24 Mixed Problem Solving',url:'/module4/lesson-4-24.html',min:15}]}
];
function getP(){return JSON.parse(localStorage.getItem('pa_progress')||'{}')}
function getName(){return localStorage.getItem('pa_name')||'Student'}
let active=0;
function renderTabs(){
  const p=getP(),te=document.getElementById('tabs');te.innerHTML='';
  const t0=document.createElement('div');t0.className='tab'+(active===0?' active':'');if(active===0)t0.style.cssText='background:var(--navy);color:#fff';t0.textContent='All modules';t0.onclick=()=>{active=0;renderTabs();renderContent();};te.appendChild(t0);
  CUR.forEach(m=>{const done=m.lessons.filter(l=>Object.keys(p).includes(l.id)).length,c=MC[m.mod],t=document.createElement('div');t.className='tab'+(active===m.mod?' active':'');if(active===m.mod)t.style.cssText=`background:${c.color};color:#fff`;t.textContent=m.label+' ('+done+'/'+m.lessons.length+')';t.onclick=()=>{active=m.mod;renderTabs();renderContent();};te.appendChild(t);});
}
function renderContent(){
  const p=getP(),el=document.getElementById('content');el.innerHTML='';
  const mods=active===0?CUR:CUR.filter(m=>m.mod===active);
  mods.forEach(m=>{
    const c=MC[m.mod],doneIds=Object.keys(p),md=m.lessons.filter(l=>doneIds.includes(l.id)).length,pct=Math.round(md/m.lessons.length*100);
    const sec=document.createElement('div');sec.className='mod-block';
    sec.innerHTML=`<div class="mod-head"><div class="mod-title" style="color:${c.color}">${m.label} — ${m.full}</div><div class="mod-meta">${md}/${m.lessons.length} complete · ${pct}%</div></div><div class="mod-pbar"><div class="mod-pfill" style="width:${pct}%;background:${c.color}"></div></div><div class="lessons-list" id="ll${m.mod}"></div>`;
    el.appendChild(sec);
    const ll=document.getElementById('ll'+m.mod);
    m.lessons.forEach((l,i)=>{
      const isDone=doneIds.includes(l.id),data=p[l.id],sp=data&&data.score!=null?Math.round(data.score*100/3):null;
      const row=document.createElement('a');row.className='lesson-row'+(isDone?' done':'');row.href=l.url;
      row.innerHTML=`<div class="l-num" style="background:${isDone?'#D1FAE5':c.bg};color:${isDone?'var(--green)':c.color}">${isDone?'✓':i+1}</div><div class="l-body"><div class="l-name">${l.title}</div><div class="l-sub">${l.min} min${data&&data.date?' · '+new Date(data.date).toLocaleDateString('en-US',{month:'short',day:'numeric'}):''}</div></div><div class="l-right">${sp!=null?`<span class="l-score" style="background:${sp>=67?'var(--green-bg)':sp>=33?'var(--amber-bg)':'var(--red-bg)'};color:${sp>=67?'var(--green)':sp>=33?'var(--amber)':'var(--red)'}">${sp}%</span>`:''}<span class="l-btn ${isDone?'done':'start'}">${isDone?'Review':'Start →'}</span></div>`;
      ll.appendChild(row);
    });
  });
}
const name=getName();document.getElementById('sidebarName').textContent=name;document.getElementById('avatarInitial').textContent=name[0].toUpperCase();
const urlMod=parseInt(new URL(location.href).searchParams.get('mod')||'0');if(urlMod>=1&&urlMod<=4)active=urlMod;
renderTabs();renderContent();
</script>
</body>
</html>
