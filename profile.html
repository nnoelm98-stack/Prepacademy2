<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrepAcademy — Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F9FA;--white:#FFFFFF;--border:#EAECF0;--border2:#F2F4F7;--navy:#0F1729;--blue:#2563EB;--blue-light:#EFF6FF;--text:#0F1729;--text2:#4B5563;--text3:#9CA3AF;--green:#15803D;--amber:#B45309;--red:#B91C1C;--r:10px;--rs:7px;--sh:0 1px 2px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
.sidebar{width:232px;flex-shrink:0;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1.25rem 1rem;position:sticky;top:0;height:100vh}
.s-logo{display:flex;align-items:center;gap:8px;padding:0 .5rem;margin-bottom:1.75rem}
.s-logo-mark{width:26px;height:26px;background:var(--navy);border-radius:6px;display:flex;align-items:center;justify-content:center}
.s-logo-mark svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.s-logo-text{font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--navy)}
.nav-section{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:0 .625rem;margin:.875rem 0 .25rem}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--rs);font-size:13.5px;color:var(--text2);cursor:pointer;margin-bottom:1px;transition:all .1s;text-decoration:none}
.nav-item:hover{background:#F3F4F6;color:var(--text)}
.nav-item.active{background:var(--blue-light);color:var(--blue);font-weight:500}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.7}.nav-item.active .nav-icon{opacity:1}
.sb-bottom{margin-top:auto;padding-top:1rem;border-top:1px solid var(--border)}
.user-row{display:flex;align-items:center;gap:9px;padding:8px 10px}
.u-av{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.main{flex:1;padding:2rem 2.5rem;overflow-y:auto;max-width:640px}
.page-title{font-size:20px;font-weight:600;letter-spacing:-.03em;color:var(--navy);margin-bottom:1.5rem}
.hero{display:flex;align-items:center;gap:1rem;padding:1.25rem;background:var(--white);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:1.25rem}
.big-av{width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;flex-shrink:0}
.hero-name{font-size:17px;font-weight:600;letter-spacing:-.02em;margin-bottom:2px}
.hero-sub{font-size:13px;color:var(--text3)}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;box-shadow:var(--sh);margin-bottom:1rem}
.card-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1rem}
.field{margin-bottom:.75rem}
.field label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px}
.field input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:8px 12px;color:var(--text);font-size:13.5px;font-family:inherit;outline:none;transition:border-color .1s}
.field input:focus{border-color:#93C5FD;background:var(--white);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.btn-primary{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .1s}
.btn-primary:hover{background:#1D4ED8}
.btn-danger{background:var(--white);color:var(--red);border:1px solid #FECACA;padding:8px 20px;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-danger:hover{background:#FEF2F2}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border2);font-size:13px}
.stat-row:last-child{border-bottom:none}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;border-radius:var(--rs);padding:10px 16px;font-size:13px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<nav class="sidebar">
  <div class="s-logo"><div class="s-logo-mark"><svg viewBox="0 0 14 14"><path d="M2 7h10M7 2l5 5-5 5"/></svg></div><span class="s-logo-text">PrepAcademy</span></div>
  <div class="nav-section">Learn</div>
  <a class="nav-item" href="dashboard.html"><svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg>Dashboard</a>
  <a class="nav-item" href="lessons.html"><svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h8"/></svg>Lessons</a>
  <div class="nav-section">Track</div>
  <a class="nav-item" href="progress.html"><svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12l3-4 3 2 3-5 3 3"/></svg>Progress</a>
  <a class="nav-item active" href="profile.html"><svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>Profile</a>
  <div class="sb-bottom"><div class="user-row"><div class="u-av" id="avatarInitial">S</div><div><div style="font-size:13px;font-weight:500;color:var(--navy)" id="sidebarName">Student</div><div style="font-size:11px;color:var(--text3)">PrepAcademy</div></div></div></div>
</nav>
<main class="main">
  <div class="page-title">Profile</div>
  <div class="hero">
    <div class="big-av" id="bigAv">S</div>
    <div><div class="hero-name" id="heroName">Student</div><div class="hero-sub" id="heroSub">PrepAcademy learner</div></div>
  </div>
  <div class="card">
    <div class="card-label">Edit profile</div>
    <div class="field"><label>Name</label><input type="text" id="iName" placeholder="Your name"></div>
    <div class="field"><label>SAT exam date</label><input type="date" id="iDate"></div>
    <div class="field"><label>Target score</label><input type="number" id="iScore" placeholder="e.g. 1450" min="400" max="1600"></div>
    <button class="btn-primary" onclick="save()">Save changes</button>
  </div>
  <div class="card">
    <div class="card-label">Stats</div>
    <div id="statsRows"></div>
  </div>
  <div class="card">
    <div class="card-label">Data</div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:1rem">Progress is saved locally in this browser.</p>
    <button class="btn-danger" onclick="reset()">Reset all progress</button>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
function getP(){return JSON.parse(localStorage.getItem('pa_progress')||'{}')}
function getName(){return localStorage.getItem('pa_name')||'Student'}
function getStreak(){const p=getP(),dates=[...new Set(Object.values(p).map(v=>v.date).filter(Boolean).map(d=>d.split('T')[0]))].sort();if(!dates.length)return 0;const t=new Date().toISOString().split('T')[0];if(dates[dates.length-1]!==t)return 0;let s=1;for(let i=dates.length-2;i>=0;i--){if((new Date(dates[i+1])-new Date(dates[i]))/86400000===1)s++;else break;}return s;}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function render(){
  const name=getName(),p=getP(),exam=localStorage.getItem('pa_exam_date')||'',target=localStorage.getItem('pa_target_score')||'';
  ['sidebarName','heroName'].forEach(id=>document.getElementById(id).textContent=name);
  ['avatarInitial','bigAv'].forEach(id=>document.getElementById(id).textContent=name[0].toUpperCase());
  document.getElementById('iName').value=name==='Student'?'':name;
  if(exam)document.getElementById('iDate').value=exam;
  if(target)document.getElementById('iScore').value=target;
  let sub='PrepAcademy learner';if(exam){const diff=Math.ceil((new Date(exam)-new Date())/86400000);if(diff>0)sub=diff+' days to exam';}
  document.getElementById('heroSub').textContent=sub;
  const doneIds=Object.keys(p),scores=Object.values(p).map(v=>v.score).filter(s=>s!=null),avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*100/3):null,best=scores.length?Math.round(Math.max(...scores)*100/3):null,ad=[...new Set(Object.values(p).map(v=>v.date).filter(Boolean).map(d=>d.split('T')[0]))];
  const rows=[['Lessons completed',doneIds.length+' / 74'],['Average score',avg!=null?avg+'%':'—'],['Best score',best!=null?best+'%':'—'],['Study streak',getStreak()+' days'],['Active study days',ad.length],['Target date',exam?new Date(exam).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'Not set'],['Target score',target||'Not set']];
  const se=document.getElementById('statsRows');se.innerHTML='';
  rows.forEach(([l,v])=>{const r=document.createElement('div');r.className='stat-row';r.innerHTML=`<span style="color:var(--text2)">${l}</span><span style="font-weight:500">${v}</span>`;se.appendChild(r);});
}
function save(){const name=document.getElementById('iName').value.trim()||'Student',exam=document.getElementById('iDate').value,sc=document.getElementById('iScore').value;localStorage.setItem('pa_name',name);if(exam)localStorage.setItem('pa_exam_date',exam);if(sc)localStorage.setItem('pa_target_score',sc);render();showToast('✓ Profile saved');}
function reset(){if(!confirm('Reset all progress? Cannot be undone.'))return;localStorage.removeItem('pa_progress');render();showToast('Progress reset');}
render();
</script>
</body>
</html>
