<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrepAcademy — Progress</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F9FA;--white:#FFFFFF;--border:#EAECF0;--border2:#F2F4F7;--navy:#0F1729;--blue:#2563EB;--blue-light:#EFF6FF;--text:#0F1729;--text2:#4B5563;--text3:#9CA3AF;--green:#15803D;--green-bg:#F0FDF4;--amber:#B45309;--amber-bg:#FFFBEB;--red:#B91C1C;--red-bg:#FEF2F2;--r:10px;--rs:7px;--sh:0 1px 2px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
.sidebar{width:232px;flex-shrink:0;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1.25rem 1rem;position:sticky;top:0;height:100vh}
.s-logo{display:flex;align-items:center;gap:8px;padding:0 .5rem;margin-bottom:1.75rem}
.s-logo-mark{width:26px;height:26px;background:var(--navy);border-radius:6px;display:flex;align-items:center;justify-content:center}
.s-logo-mark svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.s-logo-text{font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--navy)}
.nav-section{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:0 .625rem;margin:.875rem 0 .25rem}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--rs);font-size:13.5px;color:var(--text2);cursor:pointer;margin-bottom:1px;transition:all .1s;text-decoration:none}
.nav-item:hover{background:#F3F4F6;color:var(--text)}
.nav-item.active{background:var(--blue-light);color:var(--blue);font-weight:500}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.7}.nav-item.active .nav-icon{opacity:1}
.sb-bottom{margin-top:auto;padding-top:1rem;border-top:1px solid var(--border)}
.user-row{display:flex;align-items:center;gap:9px;padding:8px 10px}
.u-av{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.main{flex:1;padding:2rem 2.5rem;overflow-y:auto}
.page-title{font-size:20px;font-weight:600;letter-spacing:-.03em;color:var(--navy);margin-bottom:1.5rem}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.125rem;box-shadow:var(--sh)}
.stat-label{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.5rem}
.stat-num{font-size:24px;font-weight:300;letter-spacing:-.04em;line-height:1;margin-bottom:2px}
.stat-sub{font-size:11px;color:var(--text3)}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1.125rem 1.25rem;box-shadow:var(--sh);margin-bottom:1.25rem}
.sec-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.875rem}
.mod-row{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--border2)}
.mod-row:last-child{border-bottom:none}
.mod-label{font-size:13px;font-weight:500;width:180px;flex-shrink:0}
.mod-track{flex:1;height:6px;background:var(--border2);border-radius:99px;overflow:hidden}
.mod-fill{height:6px;border-radius:99px}
.mod-count{font-size:12px;color:var(--text3);width:44px;text-align:right;flex-shrink:0}
.score-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border2);font-size:13px}
.score-row:last-child{border-bottom:none}
.s-pill{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500;flex-shrink:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:.75rem}
.cal-dn{font-size:10px;color:var(--text3);text-align:center;padding:3px 0;text-transform:uppercase;font-weight:500}
.cal-d{font-size:12px;text-align:center;padding:6px 2px;border-radius:6px;color:var(--text3)}
.cal-d.active{background:var(--blue-light);color:var(--blue);font-weight:500}
.cal-d.today{border:1.5px solid var(--blue);color:var(--text)}
.empty{font-size:13px;color:var(--text3);padding:1.25rem 0;text-align:center}
</style>
</head>
<body>
<nav class="sidebar">
  <div class="s-logo"><div class="s-logo-mark"><svg viewBox="0 0 14 14"><path d="M2 7h10M7 2l5 5-5 5"/></svg></div><span class="s-logo-text">PrepAcademy</span></div>
  <div class="nav-section">Learn</div>
  <a class="nav-item" href="dashboard.html"><svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg>Dashboard</a>
  <a class="nav-item" href="lessons.html"><svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h8"/></svg>Lessons</a>
  <div class="nav-section">Track</div>
  <a class="nav-item active" href="progress.html"><svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12l3-4 3 2 3-5 3 3"/></svg>Progress</a>
  <a class="nav-item" href="profile.html"><svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>Profile</a>
  <div class="sb-bottom"><div class="user-row"><div class="u-av" id="avatarInitial">S</div><div><div style="font-size:13px;font-weight:500;color:var(--navy)" id="sidebarName">Student</div><div style="font-size:11px;color:var(--text3)">PrepAcademy</div></div></div></div>
</nav>
<main class="main">
  <div class="page-title">Progress</div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">DONE</div><div class="stat-num"><b id="sDone" style="color:var(--blue)">0</b></div><div class="stat-sub">of 74 lessons</div></div>
    <div class="stat-card"><div class="stat-label">AVG SCORE</div><div class="stat-num"><b id="sAvg" style="color:var(--green)">—</b></div><div class="stat-sub">all lessons</div></div>
    <div class="stat-card"><div class="stat-label">STREAK</div><div class="stat-num"><b id="sStreak" style="color:var(--amber)">0</b></div><div class="stat-sub">days in a row</div></div>
    <div class="stat-card"><div class="stat-label">BEST SCORE</div><div class="stat-num"><b id="sBest" style="color:#6D28D9">—</b></div><div class="stat-sub">single lesson</div></div>
  </div>
  <div class="card"><div class="sec-label">MODULE PROGRESS</div><div id="modBars"></div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div class="card"><div class="sec-label">SCORE HISTORY</div><div id="scoreHist"></div></div>
    <div class="card"><div class="sec-label">ACTIVITY</div><div id="calEl"></div></div>
  </div>
</main>
<script>
const MC={1:{color:'#1D4ED8'},2:{color:'#047857'},3:{color:'#6D28D9'},4:{color:'#B45309'}};
const MODS=[{mod:1,label:'Module 1',ids:['1-1','1-2','1-3','1-4','1-5','1-6','1-7','1-8','1-9','1-10']},{mod:2,label:'Module 2',ids:['2-1','2-2','2-3','2-4','2-5','2-6','2-7','2-8','2-9','2-10','2-11','2-12','2-13','2-14','2-15','2-16','2-17','2-18']},{mod:3,label:'Module 3',ids:['3-1','3-2','3-3','3-4','3-5','3-6','3-7','3-8','3-9','3-10','3-11','3-12','3-13','3-14','3-15','3-16','3-17','3-18','3-19','3-20','3-21','3-22']},{mod:4,label:'Module 4',ids:['4-1','4-2','4-3','4-4','4-5','4-6','4-7','4-8','4-9','4-10','4-11','4-12','4-13','4-14','4-15','4-16','4-17','4-18','4-19','4-20','4-21','4-22','4-23','4-24']}];
const TITLES={'1-1':'1.1 Central Ideas','1-2':'1.2 Command of Evidence','1-3':'1.3 Inferences','1-4':'1.4 Purpose','1-5':'1.5 Text Structure','1-6':'1.6 Cross-Text','1-7':'1.7 Quantitative','1-8':'1.8 Rhetorical Synth','1-9':'1.9 Purpose','1-10':'1.10 Paired Passages','2-1':'2.1 Transitions','2-2':'2.2 Sentence Bdry','2-3':'2.3 S-V Agreement','2-4':'2.4 Pronouns','2-5':'2.5 Commas','2-6':'2.6 Semicolons','2-7':'2.7 Dashes','2-8':'2.8 Rhetorical Goal','2-9':'2.9 Supporting Detail','2-10':'2.10 Concision','2-11':'2.11 Sequence','2-12':'2.12 Word Choice','2-13':'2.13 Formal/Informal','2-14':'2.14 Verb Tense','2-15':'2.15 Parallel Struct.','2-16':'2.16 Modifiers','2-17':'2.17 Possessives','2-18':'2.18 Confused Words','3-1':'3.1 Linear Eq.','3-2':'3.2 Two Variables','3-3':'3.3 Systems','3-4':'3.4 Inequalities','3-5':'3.5 Linear Ineq.','3-6':'3.6 Abs. Value Ineq.','3-7':'3.7 Absolute Value','3-8':'3.8 Linear Fns','3-9':'3.9 Quadratics Intro','3-10':'3.10 Quadratics','3-11':'3.11 Parabolas','3-12':'3.12 Polynomials','3-13':'3.13 Rational Expr.','3-14':'3.14 Radicals','3-15':'3.15 Exponential','3-16':'3.16 Functions','3-17':'3.17 Ratios','3-18':'3.18 Percentages','3-19':'3.19 Units','3-20':'3.20 Statistics','3-21':'3.21 Scatterplots','3-22':'3.22 Probability','4-1':'4.1 Linear Graphs','4-2':'4.2 Systems','4-3':'4.3 Quadratics','4-4':'4.4 Exponential','4-5':'4.5 Geometry','4-6':'4.6 Triangles','4-7':'4.7 Trig','4-8':'4.8 Circles','4-9':'4.9 Volume','4-10':'4.10 Coord. Geo.','4-11':'4.11 Statistics','4-12':'4.12 Probability','4-13':'4.13 Complex No.','4-14':'4.14 Polynomials','4-15':'4.15 Models','4-16':'4.16 Two-Var Data','4-17':'4.17 Inference','4-18':'4.18 Ratios','4-19':'4.19 Percentages','4-20':'4.20 Transformations','4-21':'4.21 Inequalities','4-22':'4.22 Quad. Apps','4-23':'4.23 Geo. Apps','4-24':'4.24 Mixed'};
function getP(){return JSON.parse(localStorage.getItem('pa_progress')||'{}')}
function getName(){return localStorage.getItem('pa_name')||'Student'}
function getStreak(){const p=getP(),dates=[...new Set(Object.values(p).map(v=>v.date).filter(Boolean).map(d=>d.split('T')[0]))].sort();if(!dates.length)return 0;const t=new Date().toISOString().split('T')[0];if(dates[dates.length-1]!==t)return 0;let s=1;for(let i=dates.length-2;i>=0;i--){if((new Date(dates[i+1])-new Date(dates[i]))/86400000===1)s++;else break;}return s;}
function render(){
  const p=getP(),name=getName(),doneIds=Object.keys(p),scores=Object.values(p).map(v=>v.score).filter(s=>s!=null);
  document.getElementById('sidebarName').textContent=name;document.getElementById('avatarInitial').textContent=name[0].toUpperCase();
  document.getElementById('sDone').textContent=doneIds.length;
  document.getElementById('sAvg').textContent=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*100/3)+'%':'—';
  document.getElementById('sStreak').textContent=getStreak();
  document.getElementById('sBest').textContent=scores.length?Math.round(Math.max(...scores)*100/3)+'%':'—';
  const be=document.getElementById('modBars');be.innerHTML='';
  MODS.forEach(m=>{const d=m.ids.filter(id=>doneIds.includes(id)).length,pct=Math.round(d/m.ids.length*100),c=MC[m.mod],row=document.createElement('div');row.className='mod-row';row.innerHTML=`<div class="mod-label" style="color:${c.color}">${m.label}</div><div class="mod-track"><div class="mod-fill" style="width:${pct}%;background:${c.color}"></div></div><div class="mod-count">${d}/${m.ids.length}</div>`;be.appendChild(row);});
  const he=document.getElementById('scoreHist'),sorted=Object.entries(p).filter(([,v])=>v.score!=null).sort((a,b)=>new Date(b[1].date)-new Date(a[1].date)).slice(0,10);
  if(!sorted.length){he.innerHTML='<div class="empty">No scores yet.</div>';}
  else{he.innerHTML='';sorted.forEach(([id,data])=>{const pct=Math.round(data.score*100/3),r=document.createElement('div');r.className='score-row';r.innerHTML=`<div style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:500">${TITLES[id]||id}</div><div style="font-size:11px;color:var(--text3);flex-shrink:0">${new Date(data.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div><span class="s-pill" style="background:${pct>=67?'var(--green-bg)':pct>=33?'var(--amber-bg)':'var(--red-bg)'};color:${pct>=67?'var(--green)':pct>=33?'var(--amber)':'var(--red)'}">${pct}%</span>`;he.appendChild(r);});}
  const ce=document.getElementById('calEl'),actDates=[...new Set(Object.values(p).map(v=>v.date).filter(Boolean).map(d=>d.split('T')[0]))],now=new Date(),yr=now.getFullYear(),mo=now.getMonth(),fd=new Date(yr,mo,1).getDay(),dim=new Date(yr,mo+1,0).getDate(),ts=now.toISOString().split('T')[0];
  ce.innerHTML=`<div style="font-size:12px;color:var(--text2);font-weight:500;margin-bottom:.5rem">${now.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div>`;
  const grid=document.createElement('div');grid.className='cal-grid';
  ['S','M','T','W','T','F','S'].forEach(d=>{const e=document.createElement('div');e.className='cal-dn';e.textContent=d;grid.appendChild(e);});
  for(let i=0;i<fd;i++){const e=document.createElement('div');e.className='cal-d';grid.appendChild(e);}
  for(let d=1;d<=dim;d++){const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,e=document.createElement('div');e.className='cal-d'+(actDates.includes(ds)?' active':'')+(ds===ts?' today':'');e.textContent=d;grid.appendChild(e);}
  ce.appendChild(grid);
}
render();
</script>
</body>
</html>
