<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrepAcademy — Get Started</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F9FA;--white:#fff;--navy:#0F1729;--blue:#2563EB;--blue-light:#EFF6FF;--blue-mid:#BFDBFE;--border:#EAECF0;--text:#0F1729;--text2:#4B5563;--text3:#9CA3AF;--r:10px;--sh:0 1px 3px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;-webkit-font-smoothing:antialiased}
.logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--navy);margin-bottom:2rem;text-decoration:none}
.logo-mark{width:26px;height:26px;background:var(--navy);border-radius:6px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.progress-wrap{width:100%;max-width:440px;margin-bottom:2rem}
.progress-track{height:3px;background:var(--border);border-radius:99px;overflow:hidden}
.progress-fill{height:3px;background:var(--blue);border-radius:99px;transition:width .35s}
.step-label{font-size:11px;color:var(--text3);text-align:right;margin-top:6px;font-weight:500}
.card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:2rem;width:100%;max-width:440px;box-shadow:var(--sh)}
.card-title{font-size:20px;font-weight:600;letter-spacing:-.03em;color:var(--navy);margin-bottom:.375rem}
.card-sub{font-size:13px;color:var(--text2);margin-bottom:1.75rem;line-height:1.5}
.field{margin-bottom:1rem}
.field label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:9px 12px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .1s,box-shadow .1s;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:#93C5FD;background:var(--white);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.field input::placeholder{color:var(--text3)}
.btn-main{width:100%;background:var(--blue);color:#fff;border:none;padding:10px;border-radius:var(--r);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:.25rem;transition:background .1s}
.btn-main:hover{background:#1D4ED8}
.divider{display:flex;align-items:center;gap:1rem;margin:1.25rem 0;color:var(--text3);font-size:12px;font-weight:500}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.btn-google{width:100%;background:var(--white);border:1px solid var(--border);padding:9px;border-radius:var(--r);font-size:13px;color:var(--text2);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color .1s}
.btn-google:hover{border-color:#D1D5DB;color:var(--text)}
.link-row{text-align:center;font-size:13px;color:var(--text3);margin-top:1.25rem}
.link-row a{color:var(--blue);font-weight:500}
/* Option buttons */
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.opt-btn{padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-weight:400;color:var(--text2);cursor:pointer;text-align:left;background:var(--white);transition:all .1s;font-family:inherit}
.opt-btn:hover,.opt-btn.selected{border-color:var(--blue);background:var(--blue-light);color:var(--blue);font-weight:500}
.opt-btn .ob-icon{font-size:18px;display:block;margin-bottom:4px}
.hidden{display:none}
/* Score targets */
.score-target{display:flex;gap:8px;flex-wrap:wrap}
.score-chip{padding:7px 14px;border:1px solid var(--border);border-radius:999px;font-size:13px;color:var(--text2);cursor:pointer;background:var(--white);transition:all .1s;font-family:inherit}
.score-chip:hover,.score-chip.selected{border-color:var(--blue);background:var(--blue-light);color:var(--blue);font-weight:500}
</style>
</head>
<body>

<a class="logo" href="index.html">
  <div class="logo-mark"><svg viewBox="0 0 14 14"><path d="M2 7h10M7 2l5 5-5 5"/></svg></div>
  PrepAcademy
</a>

<div class="progress-wrap">
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:20%"></div></div>
  <div class="step-label" id="stepLabel">Step 1 of 3</div>
</div>

<!-- STEP 1: Name -->
<div class="card" id="step1">
  <div class="card-title">Welcome to PrepAcademy</div>
  <div class="card-sub">Let's personalize your SAT prep. What's your name?</div>
  <div class="field"><label>Your name</label><input type="text" id="inputName" placeholder="First name" autocomplete="given-name"></div>
  <div class="field"><label>Email <span style="color:var(--text3);font-weight:400">(optional — for saving progress later)</span></label><input type="email" id="inputEmail" placeholder="you@email.com" autocomplete="email"></div>
  <button class="btn-main" onclick="toStep(2)">Continue →</button>
  <div class="divider">or</div>
  <button class="btn-google" onclick="toStep(2)">
    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Continue with Google
  </button>
  <div class="link-row">Already have an account? <a href="dashboard.html">Go to dashboard</a></div>
</div>

<!-- STEP 2: Exam info -->
<div class="card hidden" id="step2">
  <div class="card-title">When is your exam?</div>
  <div class="card-sub">We'll build a study schedule around your timeline.</div>
  <div class="field"><label>SAT exam date</label><input type="date" id="inputDate"></div>
  <div class="field"><label>Current SAT score estimate <span style="color:var(--text3);font-weight:400">(skip if first time)</span></label>
    <div class="score-target" id="currentScores">
      <button class="score-chip" onclick="selectChip(this,'current')">Haven't taken it</button>
      <button class="score-chip" onclick="selectChip(this,'current')">800–1000</button>
      <button class="score-chip" onclick="selectChip(this,'current')">1000–1200</button>
      <button class="score-chip" onclick="selectChip(this,'current')">1200–1400</button>
      <button class="score-chip" onclick="selectChip(this,'current')">1400+</button>
    </div>
  </div>
  <button class="btn-main" onclick="toStep(3)">Continue →</button>
  <div class="link-row"><a href="#" onclick="toStep(1);return false">← Back</a></div>
</div>

<!-- STEP 3: Target + start -->
<div class="card hidden" id="step3">
  <div class="card-title">What's your target score?</div>
  <div class="card-sub">We'll track your progress against this goal.</div>
  <div class="field">
    <div class="score-target" id="targetScores">
      <button class="score-chip" onclick="selectChip(this,'target')">1200</button>
      <button class="score-chip" onclick="selectChip(this,'target')">1300</button>
      <button class="score-chip" onclick="selectChip(this,'target')">1400</button>
      <button class="score-chip" onclick="selectChip(this,'target')">1500</button>
      <button class="score-chip" onclick="selectChip(this,'target')">1550+</button>
    </div>
  </div>
  <button class="btn-main" onclick="finish()" style="margin-top:.75rem">Start learning →</button>
  <div class="link-row"><a href="#" onclick="toStep(2);return false">← Back</a></div>
</div>

<script>
const steps=[null,document.getElementById('step1'),document.getElementById('step2'),document.getElementById('step3')];
const fills=['20%','60%','100%'];
let cur=1;
function toStep(n){
  if(n===2){const name=document.getElementById('inputName').value.trim();if(name)localStorage.setItem('pa_name',name);}
  if(n===3){const d=document.getElementById('inputDate').value;if(d)localStorage.setItem('pa_exam_date',d);}
  steps[cur].classList.add('hidden');cur=n;steps[cur].classList.remove('hidden');
  document.getElementById('progressFill').style.width=fills[n-1];
  document.getElementById('stepLabel').textContent='Step '+n+' of 3';
}
function selectChip(el,group){document.querySelectorAll('[onclick*="\''+group+'\'"]').forEach(c=>c.classList.remove('selected'));el.classList.add('selected');}
function finish(){
  const target=document.querySelector('#targetScores .selected');
  if(target)localStorage.setItem('pa_target_score',target.textContent.replace('+',''));
  window.location.href='dashboard.html';
}
</script>
</body>
</html>
